    />
    <link rel="stylesheet" href="/css/reset.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <link rel="stylesheet" href="/css/work-portfolio.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link

    />

  <body>
    <section class="fv">
      <div class="close-btn">
        <button type="button" onclick="history.back()">CLOSE</button>
      </div>

      <div class="fv-content">
        <div class="work-fv">
          <img
            class="work-fv-img"
            src="/img/work-hover-img/work-fv portfolio.png"
            alt="スライド型ポートフォリオ表紙画像"
          />
        </div>

        <div class="fv-textarea">
          <div class="position-tag">
            <h1 class="text-white">Presentation</h1>
            <h1 class="text-black">Design</h1>
          </div>

          <div class="work-expl-fv">
            <h2 class="category">自主制作</h2>
            <p class="site-title">提案型(スライド型)ポートフォリオ</p>
            <p class="expl">
              WEBサイトやLP制作における、デザインコンセプトなどをお伝えする資料を制作。
            </p>
          </div>

          <div class="work-link">
            <a
              class="site-link 01"
              href="https://www.figma.com/deck/4DEPEguRu8uY8Gx57jv8pd/%EF%BC%9C%E8%B3%87%E6%96%99%E5%9E%8B%EF%BC%9E%E3%83%9D%E3%83%BC%E3%83%88%E3%83%95%E3%82%A9%E3%83%AA%E3%82%AA?node-id=417-671&t=C59EUoLdkTMIbCnF-1"
            >
              View Design (Figma)
            </a>
          </div>
        </div>
      </div>
    </section>

    <section class="work-expl-subpage">
      <div class="subpage-content">
        <div class="subpage period">
          <h3 class="subpage-title">Production Period</h3>
          <p class="subpage-text">【 Plannin・Design 】約68時間（修正含む）</p>
        </div>

        <div class="subpage software">
          <h3 class="subpage-title">Software</h3>
          <div class="software-img">
            <!-- <img
              class="subpage-img ps"
              src="/img/service/skillicon-img-ps.png"
              alt="Photoshopアイコン"
            /> -->
            <img
              class="subpage-img figma"
              src="/img/service/skillicon-img-figma.png"
              alt="Figmaアイコン"
            />
            <!-- <img
              class="subpage-img studio"
              src="/img/service/skillicon-img-studio.png"
              alt="Studioアイコン"
            /> -->
          </div>
        </div>

        <div class="subpage logic">
          <h3 class="subpage-title">Design Logic</h3>
          <p class="subpage-text">
            WEBポートフォリオの雰囲気を踏襲しつつも、「提案」であることから、視認性を重視したデザイン。
          </p>
        </div>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="js/slide.js"></script>
